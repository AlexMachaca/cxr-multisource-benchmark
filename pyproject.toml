[project]
name = "biomedinformatics-eda"
version = "0.1.0"
description = "EDA y preprocesamiento de datasets para el artículo BioMedInformatics"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.4.0",
    "imagehash>=4.3.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "python-gdcm>=3.2.6",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
